[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "膝MRIの異常検出 (Kaggle RSNA Knee Abnormality Detection)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 数値計算・データハンドリング
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.5",
    # 深層学習
    "torch>=2.7",
    "torchvision>=0.22",
    "lightning>=2.5",
    "timm>=1.0",
    # 多言語の読影レポートを扱う用 (テキストエンコーダ)
    "transformers>=4.50",
    # DICOM 読み込み (+ 圧縮転送構文のデコーダ)
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.3",
    "pylibjpeg-openjpeg>=2.4",
    # 画像処理・データ拡張
    "opencv-python-headless>=4.10",
    "albumentations>=2.0",
    # Kaggle CLI
    "kaggle>=1.7",
    # 可視化
    "matplotlib>=3.8",
    # Notebook / 進捗
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "tqdm>=4.66",
    # 学習ログ・設定管理
    "tensorboard>=2.18",
    "hydra-core>=1.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# 開発用
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
environments = [
    "sys_platform == 'linux' and python_version == '3.12'",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129" },
]
torchvision = [
    { index = "pytorch-cu129" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
